<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Use relative paths for local preview and GitHub Pages deployment -->
    <base href="./" />
    <title>Happy Birthday — Timeline</title>
    <meta name="description" content="A Hogwarts-meets-Fearless chronicle of spells, starlit nights, and healing heroics" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />

    <!-- Fonts + theme CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
:root{
  --hp-bg:#f6ead0;
  --hp-paper:#fff8e6;
  --hp-accent:#8b5a17;
  --hp-text:#3e2b17;
  --hp-muted:#7d643c;
  --max-content-width:1100px;
}
*, *::before, *::after{box-sizing:border-box;}
html,body{min-height:100%;margin:0;background-image:radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 18%), radial-gradient(circle at bottom right, rgba(237,210,148,0.65), transparent 20%), linear-gradient(rgba(250,237,211,0.88), rgba(235,203,140,0.88)), url('https://upload.wikimedia.org/wikipedia/commons/7/74/Neuschwanstein_Castle_2013.jpg');background-size:cover;background-position:center;background-attachment:fixed;font-family:Cardo,Georgia,serif;color:var(--hp-text);overflow-x:hidden;}
.page{max-width:var(--max-content-width);margin:2.25rem auto;padding:2rem;background:rgba(255,248,230,0.94);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,0.12);border:1px solid rgba(139,101,64,0.16)}
.header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.crest{width:60px;height:60px;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,0.06);font-family:'Cinzel',serif}
.header-accent{color:var(--hp-accent);font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,0.6);font-size:1.9rem}
.lead{margin:0;color:var(--hp-muted);font-style:italic}

/* right-aligned small toolbar inside header */
.header-toolbar{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.header-btn{padding:.35rem .5rem;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--hp-text);cursor:pointer}

/* Tools dropdown in the header */
.dropdown{position:relative}
.dropdown-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;display:none;flex-direction:column;background:rgba(255,248,230,0.98);border:1px solid rgba(139,101,64,0.2);border-radius:10px;box-shadow:0 12px 32px rgba(97,67,35,0.18);padding:.35rem;z-index:50}
.dropdown.open .dropdown-menu{display:flex}
.dropdown-item{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;padding:.5rem .65rem;border-radius:6px;color:var(--hp-text);text-decoration:none;white-space:nowrap}
.dropdown-item:hover{background:rgba(139,101,64,0.12)}
.dropdown-sub{color:var(--hp-muted);font-size:.82rem;font-style:italic}
.dropdown-item .dropdown-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

/* Timeline layout */
.timeline{position:relative;margin-top:1.5rem;padding:1rem 0}
.line{position:absolute;left:50%;width:6px;background:linear-gradient(#d4af37,#b07e2f);top:0;bottom:0;margin-left:-3px;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.entry{position:relative;width:44%;padding:1.2rem 1.35rem;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(247,220,145,0.95));box-shadow:0 16px 32px rgba(97,67,35,0.18);border:1px solid rgba(139,101,64,0.18);margin:1rem 0}
.entry .date{font-weight:700;color:var(--hp-accent);margin-bottom:.35rem;letter-spacing:.02em}
.entry h3{margin:.2rem 0;color:var(--hp-text)}
.entry .meta{font-size:1.06rem;color:var(--hp-muted);margin-top:.6rem;line-height:1.7}
.left{left:0;margin-right:6%}
.right{left:56%}
.entry .media{margin-top:.85rem}
.entry img{display:block;width:100%;height:auto;border-radius:14px;object-fit:cover;border:1px solid rgba(139,101,64,0.12)}
.entry.clickable{cursor:pointer;}
.entry.clickable:hover{transform:translateY(-1px);box-shadow:0 18px 38px rgba(97,67,35,0.22)}
.media-hint{margin-top:.75rem;color:var(--hp-muted);font-size:0.98rem;font-style:italic;text-align:center;user-select:none}
.media img.hidden{display:none}
.media img.revealed{display:block;margin-top:.85rem}

/* HERO: make image visually prominent and full-bleed inside card */
#entry-hero{background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(240,217,155,0.95));padding:0;border-radius:20px;overflow:hidden;border:1px solid rgba(139,101,64,0.22)}
#entry-hero .media{width:100%}
#entry-hero img.hp-hero{width:100%;height:520px;object-fit:cover;border-radius:0}
#entry-hero .hp-caption{border-left:4px solid var(--hp-accent);padding:1rem 1.35rem;margin:0;color:var(--hp-text);background:rgba(245,235,206,0.9);font-style:italic;letter-spacing:.01em}

/* Controls */
.controls{margin-top:1.25rem;display:flex;gap:.5rem;align-items:center}
.btn{padding:.45rem .6rem;border-radius:4px;border:1px solid rgba(255,255,255,0.06);background:#fff;color:#111;cursor:pointer}
.btn-ghost{background:transparent;color:var(--hp-text);border:1px solid rgba(255,255,255,0.04)}

/* Toggle pill */
.toggle-pill{background:rgba(255,255,255,0.03);border-radius:999px;padding:.25rem .5rem;color:var(--hp-muted);font-size:.95rem}

/* Responsive: single column on narrow screens */
@media (max-width:900px){
  .entry{width:100%;left:0 !important;margin-right:0}
  .right{left:0}
  .line{left:4px;width:4px;margin-left:0}
  .page{padding:1rem}
  .header-accent{font-size:1.5rem}
  #entry-hero img.hp-hero{height:400px}
}

/* Accessibility focus */
.entry:focus{outline:none;box-shadow:0 0 0 3px rgba(212,175,55,0.12)}
.entry .meta a{color:var(--hp-accent)}
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="crest">K</div>
        <div>
          <div class="header-accent">Enchanted &amp; Fearless Timeline</div>
          <div class="lead">A Hogwarts-meets-Fearless chronicle of spells, starlit nights, and healing heroics</div>
        </div>
        <div class="header-toolbar">
          <div class="dropdown" id="toolsDropdown">
            <button id="toolsBtn" class="header-btn" aria-haspopup="true" aria-expanded="false">⚙️ Tools ▾</button>
            <div class="dropdown-menu" role="menu">
              <a class="dropdown-item" role="menuitem" href="./pdf-tools.html">📄 PDF Tools <span class="dropdown-sub">Merge &amp; compress</span></a>
              <a class="dropdown-item" role="menuitem" href="./ipo/">📈 IPO Tracker <span class="dropdown-sub">Offline IPO &amp; P&amp;L tracker</span></a>
              <a class="dropdown-item" role="menuitem" href="./tn-utilities/">⚡ TN Utilities <span class="dropdown-sub">Electricity, water &amp; tax tracker</span></a>
            </div>
          </div>
          <button id="confettiBtnHeader" class="header-btn" title="Summon confetti">🪄✨</button>
        </div>
      </header>

      <div id="timeline" class="timeline">
        <div class="line"></div>
        <!-- Entries will be appended here by the script -->
      </div>

      <div class="controls">
        <button class="btn" id="confettiBtn">Summon Glitter</button>
        <div style="margin-left:auto;display:flex;gap:.5rem;align-items:center">
          <div class="toggle-pill" id="orderLabel">Order: <strong id="orderState">Chronological</strong></div>
          <button id="orderToggle" class="btn btn-ghost">Flip Timeline</button>
        </div>
      </div>
    </div>

    <script>
    // Small improvements: clear previous entries (except hero) and start in chronological order
    let newestFirst = false;

    async function loadTimeline(){
      try{
        const res = await fetch('data/timeline.json',{cache: 'no-store'});
        if(!res.ok) throw new Error('Timeline data not found');
        const data = await res.json();
        renderTimeline(data.items || []);
      }catch(err){
        const el = document.getElementById('timeline');
        el.insertAdjacentHTML('beforeend', `<p style="padding:1rem;color:var(--hp-muted)">Could not load timeline data: ${err.message}. Check the repository data/timeline.json.</p>`);
      }
    }

    function renderTimeline(items){
      const container = document.getElementById('timeline');
      // remove existing entries (except hero)
      Array.from(container.querySelectorAll('.entry')).forEach(e=>{ if(e.id !== 'entry-hero') e.remove(); });

      // sort by actual date value
      items.sort((a,b)=> {
        const da = Date.parse(a.date);
        const db = Date.parse(b.date);
        return newestFirst ? db - da : da - db;
      });

      // append
      items.forEach((it, idx)=>{
        const side = (idx % 2 === 0) ? 'left' : 'right';
        const entry = document.createElement('article');
        const entryClasses = ['entry', side];
        if(it.image) entryClasses.push('clickable');
        entry.className = entryClasses.join(' ');
        entry.tabIndex = 0;

        let mediaHTML = '';
        if(it.image){
          const safeSrc = escapeHTML(it.image);
          const safeAlt = escapeHTML(it.title||'Image');
          mediaHTML += `<div class="media"><img class="hidden" data-src="${safeSrc}" alt="${safeAlt}"></div><div class="media-hint">Click anywhere in this card to reveal the image</div>`;
        }
        if(it.video){
          if(isYouTube(it.video)){
            const v = youTubeEmbed(it.video);
            mediaHTML += `<iframe src="${v}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%;height:280px;border-radius:8px;margin-top:.6rem"></iframe>`;
          } else if(isVimeo(it.video)){
            mediaHTML += `<iframe src="${it.video}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;height:280px;border-radius:8px;margin-top:.6rem"></iframe>`;
          } else {
            mediaHTML += `<p class="meta">Video: <a href="${escapeHTML(it.video)}" target="_blank">Open video</a></p>`;
          }
        }

        entry.innerHTML = `\n          <div class="date">${escapeHTML(formatDate(it.date))}</div>\n          <h3>${escapeHTML(it.title)}</h3>\n          <div class="meta">${escapeHTML(it.caption || '')}</div>\n          ${mediaHTML}\n        `;
        container.appendChild(entry);

        if(it.image){
          const toggleImage = ()=>{
            const img = entry.querySelector('img');
            if(!img) return;
            const isHidden = img.classList.contains('hidden');
            if(isHidden){
              img.src = img.dataset.src;
              img.classList.remove('hidden');
              img.classList.add('revealed');
              entry.setAttribute('aria-expanded','true');
            } else {
              img.classList.remove('revealed');
              img.classList.add('hidden');
              img.src = '';
              entry.setAttribute('aria-expanded','false');
            }
          };

          entry.addEventListener('click', (event)=>{
            if(event.target.closest('.media') || event.target.closest('.media-hint') || event.target === entry || event.target.closest('article')){
              toggleImage();
            }
          });

          entry.addEventListener('keydown', (event)=>{
            if(event.key === 'Enter' || event.key === ' '){
              event.preventDefault();
              toggleImage();
            }
          });
        }

        // small click feedback
        entry.addEventListener('click', ()=>{ entry.style.transform = 'scale(1.01)'; setTimeout(()=>entry.style.transform=''); });
      });

      // update order label (more descriptive)
      document.getElementById('orderState').textContent = newestFirst ? 'Reverse Chronological' : 'Chronological';
    }

    function escapeHTML(s){ if(!s) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }
    function formatDate(s){
      if(!s) return '';
      const t = Date.parse(s);
      if(isNaN(t)) return escapeHTML(s);
      const d = new Date(t);
      const day = d.getUTCDate();
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      if(day === 1) return `${d.getUTCFullYear()}-${monthNames[d.getUTCMonth()]}`;
      return d.toISOString().slice(0,10);
    }
    function isYouTube(url){ return /youtube|youtu.be/.test(url); }
    function youTubeEmbed(v){ const idMatch = v.match(/(?:v=|v\/|embed\/|youtu\.be\/)([A-Za-z0-9_-]{6,})/); const id = idMatch? idMatch[1] : ''; return `https://www.youtube.com/embed/${id}`; }
    function isVimeo(url){ return /vimeo/.test(url); }

    function throwConfetti(times=60){
      const container = document.createElement('div');
      Object.assign(container.style,{position:'fixed',inset:0,pointerEvents:'none',zIndex:9999});
      document.body.appendChild(container);
      for(let i=0;i<times;i++){
        const el = document.createElement('div');
        el.textContent = ['🎉','✨','🪄','🧹','⚡'][Math.floor(Math.random()*5)];
        Object.assign(el.style,{position:'absolute',left:Math.random()*100+'%',top:(-10 - Math.random()*20)+'px',fontSize:(12+Math.random()*36)+'px',opacity:0,transform:`translateY(0)`});
        container.appendChild(el);
        requestAnimationFrame(()=>{ el.style.opacity=1; el.style.transform = `translateY(${600 + Math.random()*600}px) rotate(${Math.random()*720-360}deg)`; el.style.transition='transform 2.6s cubic-bezier(.2,.8,.2,1), opacity .8s'; });
      }
      setTimeout(()=>container.remove(),3300 + Math.random()*1200);
    }

    // wire confetti buttons (header + controls) if present
    document.getElementById('confettiBtn')?.addEventListener('click', ()=>throwConfetti(100));
    document.getElementById('confettiBtnHeader')?.addEventListener('click', ()=>throwConfetti(120));

    document.getElementById('orderToggle').addEventListener('click', ()=>{
      newestFirst = !newestFirst; renderTimeline(window._timelineItems || []);
    });

    // Load and cache items onto window so toggle is instant
    (async function(){
      try{
        const res = await fetch('data/timeline.json',{cache:'no-store'});
        if(res.ok){
          const data = await res.json(); window._timelineItems = data.items || []; renderTimeline(window._timelineItems);
        } else { loadTimeline(); }
      }catch(e){ loadTimeline(); }
    })();

    // Tools dropdown
    const toolsDropdown = document.getElementById('toolsDropdown');
    const toolsBtn = document.getElementById('toolsBtn');
    toolsBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const open = toolsDropdown.classList.toggle('open');
      toolsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e)=>{
      if(!toolsDropdown.contains(e.target)){
        toolsDropdown.classList.remove('open');
        toolsBtn.setAttribute('aria-expanded','false');
      }
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){
        toolsDropdown.classList.remove('open');
        toolsBtn.setAttribute('aria-expanded','false');
        toolsBtn.focus();
      }
    });
    </script>
  </body>
</html>
